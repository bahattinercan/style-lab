<!doctype html>
<html lang="tr" data-style="__STYLE__">
<head>

<title>Emlak · Mobil</title>
<link rel="stylesheet" href="../tokens.css">

<body class="__BODY_CLASS__" style="overflow:hidden">
<div class="est-m">

  <div class="statusbar"><span>9:41</span><span class="right">5G ▮▮▮ 82%</span></div>

  <div class="hero">
    <div class="est-photo __MOTIF__"><span class="est-cap">poster · 00:12 döngü</span></div>
    <div class="ov">
      <div class="est-film-badge" style="position:static;align-self:flex-start"><span class="dot"></span> poster · döngü</div>
      <span class="est-kicker">Beşiktaş · No. 04</span>
      <h1>Boğaz'a bakan yalı dairesi</h1>
      <div class="est-row" style="gap:6px">
        <span class="chip">4+1</span><span class="chip">320 m²</span><span class="chip">2019</span>
        <span class="chip" style="margin-left:auto">❙❙ duraklat</span>
      </div>
    </div>
  </div>

  <div class="body">
    <div class="kunye">
      <div><b>₺84.500.000</b><span>peşin</span></div>
      <div><b>₺264.000</b><span>m² fiyatı</span></div>
      <div><b>3. kat</b><span>güney</span></div>
    </div>

    <div class="est-between">
      <span class="est-kicker">360° tur</span>
      <span class="est-mono">18 kare</span>
    </div>
    <div class="tour">
      <div class="est-photo"><span class="est-cap">salon</span></div>
      <div class="est-photo"><span class="est-cap">teras</span></div>
    </div>

    <div class="est-between">
      <span class="est-kicker">mahalle</span>
      <span class="est-mono">iskele 6 dk</span>
    </div>
    <div class="est-map" style="min-height:94px">
      <div class="water"></div>
      <div class="road r1"></div>
      <div class="est-pin p1"><i></i></div>
      <div class="est-pin p2"><i></i></div>
    </div>
  </div>

  <div class="agent-bar">
    <span class="avatar" style="width:34px;height:34px;font-size:11px">EB</span>
    <div style="display:flex;flex-direction:column;line-height:1.25">
      <b style="font-size:11.5px">Elif Barut</b>
      <span class="est-mono" style="font-size:7.5px">danışman · 2 saat içinde</span>
    </div>
    <button class="btn">Görüşme talep et</button>
  </div>

  <div class="sig"></div>
</div>
