<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
<!-- Technical Silver Canvas -->
  <rect width="1600" height="1000" fill="#f1f4f7" />

  <!-- Outer Console Frame -->
  <rect x="60" y="40" width="1480" height="920" fill="#ffffff" stroke="#101820" stroke-width="2" rx="4" />

  <!-- Header -->
  <rect x="60" y="40" width="1480" height="50" fill="#101820" />
  <text x="90" y="72" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="2">AUTONOMOUS FLEET TELEMETRY // ROUTE DISPATCH MAP</text>
  <text x="1320" y="72" fill="#7b8892" font-family="monospace" font-size="13">ACTIVE UNITS: 24/24</text>

  <!-- Fleet Map Grid Section (Left & Center) -->
  <rect x="100" y="120" width="980" height="580" fill="#f1f4f7" stroke="#d9e0e7" />

  <!-- Grid Lines -->
  <line x1="100" y1="120" x2="100" y2="700" stroke="#d9e0e7" stroke-dasharray="4 4" />
<line x1="210" y1="120" x2="210" y2="700" stroke="#d9e0e7" stroke-dasharray="4 4" />
<line x1="320" y1="120" x2="320" y2="700" stroke="#d9e0e7" stroke-dasharray="4 4" />
<line x1="430" y1="120" x2="430" y2="700" stroke="#d9e0e7" stroke-dasharray="4 4" />
<line x1="540" y1="120" x2="540" y2="700" stroke="#d9e0e7" stroke-dasharray="4 4" />
<line x1="650" y1="120" x2="650" y2="700" stroke="#d9e0e7" stroke-dasharray="4 4" />
<line x1="760" y1="120" x2="760" y2="700" stroke="#d9e0e7" stroke-dasharray="4 4" />
<line x1="870" y1="120" x2="870" y2="700" stroke="#d9e0e7" stroke-dasharray="4 4" />
<line x1="980" y1="120" x2="980" y2="700" stroke="#d9e0e7" stroke-dasharray="4 4" />
  <line x1="100" y1="120" x2="1080" y2="120" stroke="#d9e0e7" stroke-dasharray="4 4" />
<line x1="100" y1="235" x2="1080" y2="235" stroke="#d9e0e7" stroke-dasharray="4 4" />
<line x1="100" y1="350" x2="1080" y2="350" stroke="#d9e0e7" stroke-dasharray="4 4" />
<line x1="100" y1="465" x2="1080" y2="465" stroke="#d9e0e7" stroke-dasharray="4 4" />
<line x1="100" y1="580" x2="1080" y2="580" stroke="#d9e0e7" stroke-dasharray="4 4" />

  <!-- ROUTE 1: Magenta Primary Transit Corridor -->
  <path d="M 180 580 L 340 580 L 340 380 L 580 380 L 580 240 L 860 240 L 860 480 L 1020 480" fill="none" stroke="#a8386f" stroke-width="4" stroke-dasharray="10 6" />

  <!-- Route 1 Turn Pins -->
  <circle cx="180" cy="580" r="8" fill="#a8386f" />
  <circle cx="340" cy="580" r="7" fill="#a8386f" />
  <circle cx="340" cy="380" r="7" fill="#a8386f" />
  <circle cx="580" cy="380" r="7" fill="#a8386f" />
  <circle cx="580" cy="240" r="7" fill="#a8386f" />
  <circle cx="860" cy="240" r="7" fill="#a8386f" />
  <circle cx="860" cy="480" r="7" fill="#a8386f" />
  <circle cx="1020" cy="480" r="8" fill="#a8386f" />

  <!-- ROUTE 2: Secondary Dark Corridor -->
  <path d="M 220 220 L 460 220 L 460 480 L 740 480 L 740 620 L 980 620" fill="none" stroke="#101820" stroke-width="3" stroke-dasharray="6 6" />
  <circle cx="220" cy="220" r="6" fill="#101820" />
  <circle cx="460" cy="220" r="6" fill="#101820" />
  <circle cx="460" cy="480" r="6" fill="#101820" />
  <circle cx="740" cy="480" r="6" fill="#101820" />
  <circle cx="740" cy="620" r="6" fill="#101820" />
  <circle cx="980" cy="620" r="6" fill="#101820" />

  <!-- Vehicle Telemetry Pin 1 -->
  <g transform="translate(580, 380)">
    <circle cx="0" cy="0" r="14" fill="#a8386f" fill-opacity="0.25" />
    <circle cx="0" cy="0" r="8" fill="#a8386f" />
    <!-- Callout Box -->
    <rect x="18" y="-45" width="160" height="52" fill="#101820" rx="3" />
    <text x="26" y="-28" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">UNIT-08 [ACTIVE]</text>
    <text x="26" y="-10" font-family="monospace" font-size="11" fill="#a8386f">62 MPH · SOC 84%</text>
  </g>

  <!-- Vehicle Telemetry Pin 2 -->
  <g transform="translate(860, 240)">
    <circle cx="0" cy="0" r="14" fill="#1c6b45" fill-opacity="0.25" />
    <circle cx="0" cy="0" r="8" fill="#1c6b45" />
    <rect x="18" y="-45" width="160" height="52" fill="#101820" rx="3" />
    <text x="26" y="-28" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">UNIT-14 [EN ROUTE]</text>
    <text x="26" y="-10" font-family="monospace" font-size="11" fill="#1c6b45">48 MPH · SOC 61%</text>
  </g>

  <!-- Vehicle Telemetry Pin 3 -->
  <g transform="translate(460, 480)">
    <circle cx="0" cy="0" r="14" fill="#a3201a" fill-opacity="0.25" />
    <circle cx="0" cy="0" r="8" fill="#a3201a" />
    <rect x="18" y="-45" width="160" height="52" fill="#101820" rx="3" />
    <text x="26" y="-28" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">UNIT-22 [SERVICE]</text>
    <text x="26" y="-10" font-family="monospace" font-size="11" fill="#a3201a">0 MPH · CHARGING</text>
  </g>

  <!--Right Telemetry Status Panel-->
  <rect x="1120" y="120" width="420" height="580" fill="#f1f4f7" stroke="#d9e0e7" rx="4" />
  <rect x="1120" y="120" width="420" height="40" fill="#101820" />
  <text x="1140" y="145" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff">FLEET DISPATCH ROSTER</text>

  <!-- Status Cards -->
  <g transform="translate(1140, 180)">
    <rect x="0" y="0" width="380" height="60" fill="#ffffff" stroke="#d9e0e7" rx="3" />
    <text x="20" y="35" font-family="monospace" font-size="14" font-weight="bold" fill="#101820">CORRIDOR A (EAST)</text>
    <text x="360" y="35" font-family="monospace" font-size="14" font-weight="bold" fill="#a8386f" text-anchor="end">12 UNITS</text>

    <rect x="0" y="70" width="380" height="60" fill="#ffffff" stroke="#d9e0e7" rx="3" />
    <text x="20" y="105" font-family="monospace" font-size="14" font-weight="bold" fill="#101820">CORRIDOR B (NORTH)</text>
    <text x="360" y="105" font-family="monospace" font-size="14" font-weight="bold" fill="#1c6b45" text-anchor="end">8 UNITS</text>

    <rect x="0" y="140" width="380" height="60" fill="#ffffff" stroke="#d9e0e7" rx="3" />
    <text x="20" y="175" font-family="monospace" font-size="14" font-weight="bold" fill="#101820">DEPOT DOCKING</text>
    <text x="360" y="175" font-family="monospace" font-size="14" font-weight="bold" fill="#a3201a" text-anchor="end">4 UNITS</text>

    <text x="0" y="240" font-family="monospace" font-size="12" font-weight="bold" fill="#47555f">ENERGY UTILIZATION</text>
    <rect x="0" y="250" width="380" height="24" fill="#e6ebf0" rx="3" />
    <rect x="0" y="250" width="288" height="24" fill="#a8386f" rx="3" />
    <text x="300" y="267" font-family="monospace" font-size="11" font-weight="bold" fill="#101820">76%</text>

    <text x="0" y="310" font-family="monospace" font-size="12" font-weight="bold" fill="#47555f">AVG LATENCY / RESPONSE</text>
    <text x="0" y="340" font-family="monospace" font-size="28" font-weight="bold" fill="#101820">14.2 ms</text>
  </g>

  <!-- Bottom Speed / Elevation Profile Chart -->
  <rect x="100" y="730" width="1440" height="190" fill="#f1f4f7" stroke="#d9e0e7" rx="4" />
  <text x="120" y="760" font-family="monospace" font-size="13" font-weight="bold" fill="#101820">CORRIDOR ELEVATION &amp; SPEED PROFILE (UNIT-08)</text>

  <!-- Speed Curve -->
  <path d="M 120 880 C 260 880, 340 820, 480 820 C 620 820, 720 850, 860 810 C 1000 770, 1140 860, 1300 840 C 1400 830, 1460 880, 1500 880" fill="none" stroke="#a8386f" stroke-width="3" />
  <!-- Shaded Area Under Curve -->
  <path d="M 120 880 C 260 880, 340 820, 480 820 C 620 820, 720 850, 860 810 C 1000 770, 1140 860, 1300 840 C 1400 830, 1460 880, 1500 880 L 1500 900 L 120 900 Z" fill="#a8386f" fill-opacity="0.12" />
</svg>
