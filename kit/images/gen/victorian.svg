<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="vic-bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7f1e3"/>
      <stop offset="50%" stop-color="#efe7d6"/>
      <stop offset="100%" stop-color="#e5dbc5"/>
    </linearGradient>
  </defs>

  <!-- Parchment Paper Background -->
  <rect width="1600" height="1000" fill="url(#vic-bg)"/>

  <!-- Ornate Engraved Double Rule Cartouche Frame -->
  <rect x="50" y="50" width="1500" height="900" fill="none" stroke="#1c1a17" stroke-width="4"/>
  <rect x="64" y="64" width="1472" height="872" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
  <rect x="76" y="76" width="1448" height="848" fill="none" stroke="#5a1e2b" stroke-width="2"/>

  <!-- 4 Corner Flourishes (Engraved Arcs & Acanthus Leaf Curves) -->
  <g stroke="#1c1a17" stroke-width="2" fill="none">
    <!-- Top-Left -->
    <path d="M 50 140 C 90 140 140 90 140 50"/>
    <path d="M 50 160 C 110 160 160 110 160 50"/>
    <circle cx="110" cy="110" r="16" fill="#5a1e2b"/>
    <circle cx="110" cy="110" r="8" fill="#f7f1e3"/>

    <!-- Top-Right -->
    <path d="M 1550 140 C 1510 140 1460 90 1460 50"/>
    <path d="M 1550 160 C 1490 160 1440 110 1440 50"/>
    <circle cx="1490" cy="110" r="16" fill="#5a1e2b"/>
    <circle cx="1490" cy="110" r="8" fill="#f7f1e3"/>

    <!-- Bottom-Left -->
    <path d="M 50 860 C 90 860 140 910 140 950"/>
    <path d="M 50 840 C 110 840 160 890 160 950"/>
    <circle cx="110" cy="890" r="16" fill="#5a1e2b"/>
    <circle cx="110" cy="890" r="8" fill="#f7f1e3"/>

    <!-- Bottom-Right -->
    <path d="M 1550 860 C 1510 860 1460 910 1460 950"/>
    <path d="M 1550 840 C 1490 840 1440 890 1440 950"/>
    <circle cx="1490" cy="890" r="16" fill="#5a1e2b"/>
    <circle cx="1490" cy="890" r="8" fill="#f7f1e3"/>
  </g>

  <!-- Central Botanical Engraving: Heritage Rose & Thistle with Etched Cross-Hatching -->
  <g transform="translate(800 480)">
    <!-- Central Oval Frame for Botanical Plate -->
    <ellipse cx="0" cy="0" rx="380" ry="340" fill="#f7f1e3" stroke="#1c1a17" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="365" ry="325" fill="none" stroke="#5a1e2b" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- Main Botanical Rose Stem -->
    <path d="M -40 280 Q -10 120 0 -30 Q 10 -140 30 -210" fill="none" stroke="#1c1a17" stroke-width="6"/>
    <!-- Thorns -->
    <path d="M -16 160 Q -40 170 -35 190 Q -20 180 -14 175 Z" fill="#5a1e2b"/>
    <path d="M -4 60 Q 20 70 15 90 Q 0 80 -2 75 Z" fill="#5a1e2b"/>

    <!-- Engraved Rose Blossom (Petals with fine cross-hatching) -->
    <g transform="translate(30 -210)">
      <!-- Outer Petals -->
      <path d="M -110 -30 C -140 -90 -40 -150 20 -140 C 80 -150 160 -80 130 -20 C 150 50 80 120 0 110 C -80 120 -130 40 -110 -30 Z" fill="#5a1e2b" stroke="#1c1a17" stroke-width="3"/>
      <!-- Inner Petal layers -->
      <path d="M -70 -20 C -90 -60 -20 -100 20 -90 C 60 -100 110 -50 90 -10 C 100 40 50 80 0 70 C -50 80 -80 30 -70 -20 Z" fill="#7a2a3b" stroke="#1c1a17" stroke-width="2"/>
      <path d="M -40 -10 C -50 -40 -10 -60 15 -55 C 40 -60 70 -30 60 -5 C 65 25 30 50 0 45 C -30 50 -50 20 -40 -10 Z" fill="#f7f1e3" stroke="#1c1a17" stroke-width="2"/>
      <!-- Center Spiral -->
      <path d="M -15 -5 Q 0 -25 15 -5 Q 0 15 -15 -5" fill="none" stroke="#1c1a17" stroke-width="3"/>
    </g>

    <!-- Botanical Leaves with Fine Vein Hatching -->
    <!-- Left Leaf -->
    <g transform="translate(-80 40) rotate(-40)">
      <path d="M 0 0 C -60 -40 -120 10 -150 80 C -80 90 -20 50 0 0 Z" fill="#4f4940" stroke="#1c1a17" stroke-width="2"/>
      <line x1="0" y1="0" x2="-140" y2="75" stroke="#f7f1e3" stroke-width="2"/>
      <!-- Leaf vein hatch lines -->
      <line x1="-30" y1="12" x2="-45" y2="3" stroke="#f7f1e3" stroke-width="1"/>
      <line x1="-60" y1="28" x2="-80" y2="15" stroke="#f7f1e3" stroke-width="1"/>
      <line x1="-90" y1="45" x2="-115" y2="30" stroke="#f7f1e3" stroke-width="1"/>
      <line x1="-30" y1="12" x2="-35" y2="28" stroke="#f7f1e3" stroke-width="1"/>
      <line x1="-60" y1="28" x2="-70" y2="52" stroke="#f7f1e3" stroke-width="1"/>
      <line x1="-90" y1="45" x2="-105" y2="72" stroke="#f7f1e3" stroke-width="1"/>
    </g>

    <!-- Right Leaf -->
    <g transform="translate(30 110) rotate(35)">
      <path d="M 0 0 C 60 -40 120 10 150 80 C 80 90 20 50 0 0 Z" fill="#4f4940" stroke="#1c1a17" stroke-width="2"/>
      <line x1="0" y1="0" x2="140" y2="75" stroke="#f7f1e3" stroke-width="2"/>
      <!-- Leaf vein hatch lines -->
      <line x1="30" y1="12" x2="45" y2="3" stroke="#f7f1e3" stroke-width="1"/>
      <line x1="60" y1="28" x2="80" y2="15" stroke="#f7f1e3" stroke-width="1"/>
      <line x1="90" y1="45" x2="115" y2="30" stroke="#f7f1e3" stroke-width="1"/>
      <line x1="30" y1="12" x2="35" y2="28" stroke="#f7f1e3" stroke-width="1"/>
      <line x1="60" y1="28" x2="70" y2="52" stroke="#f7f1e3" stroke-width="1"/>
      <line x1="90" y1="45" x2="105" y2="72" stroke="#f7f1e3" stroke-width="1"/>
    </g>

    <!-- Victorian Engraved Ribbon Banner -->
    <g transform="translate(0 260)">
      <path d="M -220 -20 Q 0 -5 220 -20 L 200 35 Q 0 50 -200 35 Z" fill="#efe7d6" stroke="#1c1a17" stroke-width="2.5"/>
      <path d="M -220 -20 L -250 10 L -200 35 Z" fill="#857c6e" stroke="#1c1a17" stroke-width="1.5"/>
      <path d="M 220 -20 L 250 10 L 200 35 Z" fill="#857c6e" stroke="#1c1a17" stroke-width="1.5"/>
      <text x="0" y="20" font-family="'Playfair Display', Georgia, serif" font-size="22" font-variant="small-caps" letter-spacing="4" fill="#1c1a17" text-anchor="middle" font-weight="bold">FLORA · NATURALIS</text>
    </g>
  </g>
</svg>