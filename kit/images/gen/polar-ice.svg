<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="ice-water" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2733" />
      <stop offset="50%" stop-color="#093f54" />
      <stop offset="100%" stop-color="#096d8a" />
    </linearGradient>
    <linearGradient id="floe-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eaf3f8" />
    </linearGradient>
    <linearGradient id="floe-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#aed9ec" />
      <stop offset="100%" stop-color="#096d8a" />
    </linearGradient>
  </defs>

  <!-- Deep Arctic Ocean Water (Open Lead Channels) -->
  <rect width="1600" height="1000" fill="url(#ice-water)" />

  <!-- Fractured Pack-Ice Plates / Floe Polygons with 3D Calving Edges -->
  <g stroke="#0e2733" stroke-width="1.5">
    <!-- Plate 1: Large Central Floe -->
    <polygon points="460,320 880,260 1040,480 820,680 480,620 380,440" fill="url(#floe-side)" />
    <polygon points="460,300 880,240 1040,460 820,660 480,600 380,420" fill="url(#floe-top)" />

    <!-- Plate 2: Upper Right Floe -->
    <polygon points="980,120 1460,90 1520,360 1140,440 920,240" fill="url(#floe-side)" />
    <polygon points="980,105 1460,75 1520,345 1140,425 920,225" fill="url(#floe-top)" />

    <!-- Plate 3: Lower Right Floe -->
    <polygon points="920,660 1340,580 1540,840 1120,950 860,820" fill="url(#floe-side)" />
    <polygon points="920,645 1340,565 1540,825 1120,935 860,805" fill="url(#floe-top)" />

    <!-- Plate 4: Left Margin Floe -->
    <polygon points="60,180 380,140 340,420 120,520 20,380" fill="url(#floe-side)" />
    <polygon points="60,165 380,125 340,405 120,505 20,365" fill="url(#floe-top)" />

    <!-- Plate 5: Lower Left Floe -->
    <polygon points="180,620 460,580 480,880 140,940 80,760" fill="url(#floe-side)" />
    <polygon points="180,605 460,565 480,865 140,925 80,745" fill="url(#floe-top)" />
  </g>

  <!-- Hairline Stress Cracks & Thermal Crevasses in Ice Surfaces -->
  <g stroke="#096d8a" stroke-width="1.6" stroke-opacity="0.75" fill="none">
    <path d="M 520,360 L 640,420 L 720,380 L 850,440" />
    <path d="M 640,420 L 660,540 L 590,580" />
    <path d="M 1080,220 L 1220,260 L 1340,210" />
    <path d="M 1020,740 L 1140,710 L 1280,780" />
  </g>

  <!-- Hexagonal Ice Ih Molecular Lattice Schematic (Upper Center) -->
  <g transform="translate(680, 160)" stroke="#096d8a" stroke-width="1.8" fill="none">
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" />
    <polygon points="0,-40 35,-60 70,-40 35,-20" />
    <polygon points="35,20 70,40 70,80 35,60" />
    <circle cx="0" cy="-40" r="4" fill="#096d8a" />
    <circle cx="35" cy="-20" r="4" fill="#096d8a" />
    <circle cx="35" cy="20" r="4" fill="#096d8a" />
    <circle cx="0" cy="40" r="4" fill="#096d8a" />
    <circle cx="-35" cy="20" r="4" fill="#096d8a" />
    <circle cx="-35" cy="-20" r="4" fill="#096d8a" />
    <text x="85" y="10" font-family="'Space Mono', monospace" font-size="11" fill="#0e2733" stroke="none">ICE Ih LATTICE</text>
  </g>

  <!-- Cryospheric Reconnaissance Header at Top Left -->
  <g transform="translate(100, 95)">
    <text x="0" y="32" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="700" fill="#0e2733" letter-spacing="-0.5">CRYOSPHERE SURVEY // 083</text>
    <text x="0" y="62" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#096d8a" letter-spacing="3">MULTI-YEAR PACK ICE SHEET · THERMAL FRACTURE NETWORK</text>
    <text x="0" y="86" font-family="'Space Mono', monospace" font-size="12" fill="#45626f" letter-spacing="1.5">LAT: 84°12'N · LON: 04°32'W · ICE DRAFT: 3.42m · TEMP: -28.4°C · CONCENTRATION: 88%</text>
  </g>

  <!-- Cryo Telemetry Triple Metric Panel at Top Right -->
  <g transform="translate(1220, 80)">
    <rect x="0" y="0" width="280" height="90" fill="#f9fcfe" stroke="#0e2733" stroke-width="1.5" rx="4" opacity="0.9" />
    <text x="20" y="28" font-family="'Space Mono', monospace" font-size="11" fill="#45626f">FREEBOARD // ALBEDO</text>
    <text x="20" y="58" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="700" fill="#096d8a">0.42 m · 0.84</text>
  </g>
</svg>