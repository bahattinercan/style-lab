<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2620" />
      <stop offset="50%" stop-color="#19201a" />
      <stop offset="100%" stop-color="#121713" />
    </linearGradient>
    <linearGradient id="cambium-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7a469" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8a5a22" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bark-bg)" />

  <!-- Vertical Fibrous Tree Bark Furrows & Striations in Background -->
  <g stroke="#ecefe3" stroke-width="1.2" stroke-opacity="0.12">
    <line x1="120" y1="0" x2="120" y2="1000" />
    <line x1="135" y1="0" x2="135" y2="1000" stroke-opacity="0.2" />
    <line x1="210" y1="0" x2="210" y2="1000" />
    <line x1="260" y1="0" x2="260" y2="1000" stroke-opacity="0.25" stroke="#d7a469" />
    <line x1="340" y1="0" x2="340" y2="1000" />
    <line x1="420" y1="0" x2="420" y2="1000" stroke-opacity="0.18" />
    <line x1="490" y1="0" x2="490" y2="1000" />
  </g>

  <!-- Large Dendrochronology Tree Ring Cross-Section (Right Half) -->
  <g transform="translate(1180, 500)">
    <!-- Concentric Annual Growth Rings -->
    <ellipse cx="0" cy="0" rx="460" ry="430" fill="#283029" stroke="#d7a469" stroke-width="2.5" stroke-opacity="0.7" />
    <ellipse cx="0" cy="0" rx="410" ry="380" fill="none" stroke="#ecefe3" stroke-width="1" stroke-opacity="0.3" />
    <ellipse cx="0" cy="0" rx="360" ry="335" fill="none" stroke="#ecefe3" stroke-width="1.2" stroke-opacity="0.4" />
    <ellipse cx="0" cy="0" rx="310" ry="290" fill="none" stroke="#d7a469" stroke-width="2" stroke-opacity="0.6" />
    <ellipse cx="0" cy="0" rx="260" ry="245" fill="none" stroke="#ecefe3" stroke-width="1" stroke-opacity="0.35" />
    <ellipse cx="0" cy="0" rx="210" ry="195" fill="none" stroke="#ecefe3" stroke-width="1.4" stroke-opacity="0.45" />
    <ellipse cx="0" cy="0" rx="160" ry="150" fill="none" stroke="#d7a469" stroke-width="2.2" stroke-opacity="0.7" />
    <ellipse cx="0" cy="0" rx="110" ry="100" fill="none" stroke="#ecefe3" stroke-width="1.2" stroke-opacity="0.5" />
    <ellipse cx="0" cy="0" rx="60" ry="55" fill="url(#cambium-glow)" />
    <!-- Heartwood Pith Center Core -->
    <circle cx="0" cy="0" r="18" fill="#1f2620" />

    <!-- Medullary Rays (Radial Cracks & Sap Rays) -->
    <g stroke="#ecefe3" stroke-width="1" stroke-opacity="0.3" fill="none">
      <line x1="0" y1="0" x2="380" y2="120" />
      <line x1="0" y1="0" x2="-350" y2="160" />
      <line x1="0" y1="0" x2="180" y2="-380" />
      <line x1="0" y1="0" x2="-220" y2="-340" />
      <line x1="0" y1="0" x2="280" y2="-220" />
      <line x1="0" y1="0" x2="-380" y2="-80" />
    </g>

    <!-- Ring Callout Measurements -->
    <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#d7a469">
      <text x="320" y="-10">RING 114 [1912 CE]</text>
      <text x="170" y="-10">RING 050 [1976 CE]</text>
      <text x="65" y="-10">PITH [2026 CE]</text>
    </g>
  </g>

  <!-- Botanical Herbarium Specimen Label at Top Left -->
  <g transform="translate(100, 95)">
    <text x="0" y="32" font-family="'Lora', Georgia, serif" font-size="34" font-weight="600" fill="#ecefe3" letter-spacing="-0.5">Dendrochronology Field Notebook // 081</text>
    <text x="0" y="62" font-family="'EB Garamond', Georgia, serif" font-size="16" font-style="italic" fill="#d7a469" letter-spacing="2">SPECIMEN: QUERCUS ROBUR · BARK FIBER &amp; HEARTWOOD MATRIX</text>
    <text x="0" y="86" font-family="'JetBrains Mono', monospace" font-size="12" fill="#b4bfa8" letter-spacing="1.5">CAMBIUM RATIO: 0.14 · SAPWOOD THICKNESS: 48mm · RHYTIDOME FURROW DEPTH: 22mm</text>
  </g>

  <!-- Field Notebook Specimen Accession Card (Center-Left) -->
  <g transform="translate(100, 240)">
    <rect x="0" y="0" width="340" height="150" fill="#283029" stroke="#d7a469" stroke-width="1" rx="4" opacity="0.85" />
    <text x="24" y="34" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#d7a469">FORESTRY SPECIMEN #081</text>
    <text x="24" y="60" font-family="'Lora', Georgia, serif" font-size="14" fill="#ecefe3">Sample: Mature Oak Heartwood</text>
    <text x="24" y="82" font-family="'JetBrains Mono', monospace" font-size="11" fill="#b4bfa8">Location: Black Forest Plot 14-C</text>
    <text x="24" y="102" font-family="'JetBrains Mono', monospace" font-size="11" fill="#b4bfa8">Moisture Content: 18.2%</text>
    <text x="24" y="122" font-family="'JetBrains Mono', monospace" font-size="11" fill="#d7a469">Radial Growth Rate: 2.4 mm/a</text>
  </g>
</svg>