<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
<defs>
    <linearGradient id="g48-curve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b5c46" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2b5c46" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Cream Paper Background -->
  <rect width="1600" height="1000" fill="#faf7f1" />

  <!-- Outer Executive Editorial Container -->
  <rect x="60" y="60" width="1480" height="880" fill="#ffffff" stroke="#dfded9" stroke-width="1.5" />

  <!-- Header Banner -->
  <rect x="60" y="60" width="1480" height="80" fill="#faf7f1" />
  <line x1="60" y1="140" x2="1540" y2="140" stroke="#171614" stroke-width="2" />
  <line x1="60" y1="144" x2="1540" y2="144" stroke="#171614" stroke-width="0.75" />
  <text x="100" y="106" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#171614" letter-spacing="1">EXECUTIVE BRIEFING // FISCAL KPI REPORT</text>
  <text x="1360" y="106" font-family="sans-serif" font-size="13" fill="#51544b" letter-spacing="2">Q4 AUDITED</text>

  <!-- Three Hero KPI Stat Columns (y: 300 to 520) -->
  <!-- Col 1 -->
  <g transform="translate(140, 310)">
    <text x="0" y="20" font-family="sans-serif" font-size="14" font-weight="bold" fill="#51544b" letter-spacing="1.5">OPERATING MARGIN</text>
    <text x="0" y="100" font-family="Georgia, serif" font-size="78" font-weight="bold" fill="#2b5c46">38.4%</text>
    <line x1="0" y1="125" x2="360" y2="125" stroke="#dfded9" stroke-width="1" />
    <text x="0" y="155" font-family="sans-serif" font-size="14" fill="#1f6b45">▲ +4.6 pts vs Target</text>
  </g>

  <!-- Hairline Vertical Divider 1 -->
  <line x1="570" y1="300" x2="570" y2="520" stroke="#dfded9" stroke-width="1" />

  <!-- Col 2 -->
  <g transform="translate(610, 310)">
    <text x="0" y="20" font-family="sans-serif" font-size="14" font-weight="bold" fill="#51544b" letter-spacing="1.5">RECURRING REVENUE</text>
    <text x="0" y="100" font-family="Georgia, serif" font-size="78" font-weight="bold" fill="#171614">$142.8M</text>
    <line x1="0" y1="125" x2="360" y2="125" stroke="#dfded9" stroke-width="1" />
    <text x="0" y="155" font-family="sans-serif" font-size="14" fill="#1f6b45">▲ +28.2% YoY Growth</text>
  </g>

  <!-- Hairline Vertical Divider 2 -->
  <line x1="1050" y1="300" x2="1050" y2="520" stroke="#dfded9" stroke-width="1" />

  <!-- Col 3 -->
  <g transform="translate(1090, 310)">
    <text x="0" y="20" font-family="sans-serif" font-size="14" font-weight="bold" fill="#51544b" letter-spacing="1.5">CAPITAL EFFICIENCY</text>
    <text x="0" y="100" font-family="Georgia, serif" font-size="78" font-weight="bold" fill="#171614">2.45×</text>
    <line x1="0" y1="125" x2="350" y2="125" stroke="#dfded9" stroke-width="1" />
    <text x="0" y="155" font-family="sans-serif" font-size="14" fill="#51544b">BENCHMARK: 1.80×</text>
  </g>

  <!-- Hairline Section Divider -->
  <line x1="60" y1="540" x2="1540" y2="540" stroke="#171614" stroke-width="1" />

  <!-- Performance Curve Section (y: 560 to 780) -->
  <g transform="translate(140, 560)">
    <!-- Hairline Grid Rules -->
    <line x1="0" y1="40" x2="1240" y2="40" stroke="#dfded9" stroke-width="0.75" />
    <line x1="0" y1="90" x2="1240" y2="90" stroke="#dfded9" stroke-width="0.75" />
    <line x1="0" y1="140" x2="1240" y2="140" stroke="#dfded9" stroke-width="0.75" />
    <line x1="0" y1="190" x2="1240" y2="190" stroke="#171614" stroke-width="1" />

    <!-- Shaded Growth Area -->
    <path d="M 0 170 Q 300 160 600 110 T 1200 30 L 1200 190 L 0 190 Z" fill="url(#g48-curve)" />

    <!-- Primary Curve in Deep Green -->
    <path d="M 0 170 Q 300 160 600 110 T 1200 30" fill="none" stroke="#2b5c46" stroke-width="3" />

    <!-- Secondary Comparative Curve -->
    <path d="M 0 180 Q 300 170 600 140 T 1200 80" fill="none" stroke="#86897e" stroke-width="1.5" stroke-dasharray="4 2" />

    <circle cx="1200" cy="30" r="5" fill="#2b5c46" />
    <text x="1215" y="35" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#2b5c46">$142.8M</text>
  </g>

  <!-- Bottom Executive Seal -->
  <line x1="60" y1="840" x2="1540" y2="840" stroke="#dfded9" stroke-width="1" />
  <text x="120" y="880" font-family="sans-serif" font-size="12" fill="#86897e">BOARD OF DIRECTORS EXECUTIVE COPY · CONFIDENTIAL DISCLOSURE</text>
  <text x="1400" y="880" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#2b5c46">Index AAA+</text>
</svg>
