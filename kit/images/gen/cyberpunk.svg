<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="cp-bg" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0b0f"/>
      <stop offset="50%" stop-color="#15151d"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>
    <pattern id="cp-hazard" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#f9f002"/>
      <rect x="20" width="20" height="40" fill="#0b0b0f"/>
    </pattern>
    <linearGradient id="cp-cyan-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05d9e8"/>
      <stop offset="100%" stop-color="#05d9e8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#cp-bg)"/>

  <!-- Rainy Vertical City Megastructures -->
  <g fill="#101017" stroke="#1b1b26" stroke-width="1.5">
    <rect x="40" y="160" width="180" height="840"/>
    <rect x="180" y="240" width="140" height="760"/>
    <rect x="340" y="80" width="220" height="920"/>
    <rect x="600" y="220" width="260" height="780"/>
    <rect x="900" y="120" width="200" height="880"/>
    <rect x="1140" y="180" width="240" height="820"/>
    <rect x="1420" y="90" width="160" height="910"/>
  </g>

  <!-- High-tech Window Grids & Lit Vents -->
  <g fill="#05d9e8" opacity="0.35">
    <rect x="70" y="220" width="6" height="40"/><rect x="85" y="220" width="6" height="40"/><rect x="100" y="220" width="6" height="40"/>
    <rect x="380" y="140" width="140" height="4"/><rect x="380" y="160" width="140" height="4"/><rect x="380" y="180" width="140" height="4"/>
    <rect x="940" y="180" width="120" height="6"/><rect x="940" y="210" width="120" height="6"/><rect x="940" y="240" width="120" height="6"/>
  </g>
  <g fill="#f9f002" opacity="0.45">
    <rect x="640" y="280" width="180" height="6"/><rect x="640" y="300" width="180" height="6"/>
    <rect x="1180" y="240" width="160" height="4"/><rect x="1180" y="260" width="160" height="4"/>
  </g>

  <!-- Heavy Industrial Hazard Stripe Girders -->
  <!-- Top Diagonal Wedge Structure -->
  <polygon points="0,0 360,0 0,360" fill="url(#cp-hazard)"/>
  <line x1="360" y1="0" x2="0" y2="360" stroke="#f9f002" stroke-width="6"/>

  <!-- Bottom Right Hazard Bar -->
  <polygon points="1240,1000 1600,640 1600,720 1320,1000" fill="url(#cp-hazard)"/>
  <line x1="1240" y1="1000" x2="1600" y2="640" stroke="#f9f002" stroke-width="5"/>

  <!-- Rain Lines -->
  <g stroke="#05d9e8" stroke-width="1" opacity="0.25">
    <line x1="100" y1="0" x2="60" y2="300"/><line x1="280" y1="200" x2="240" y2="600"/><line x1="520" y1="100" x2="480" y2="500"/>
    <line x1="840" y1="0" x2="800" y2="400"/><line x1="1100" y1="300" x2="1060" y2="800"/><line x1="1350" y1="150" x2="1310" y2="550"/>
    <line x1="1500" y1="400" x2="1460" y2="900"/>
  </g>

  <!-- Tactical HUD Targeting Reticle System (Center) -->
  <g transform="translate(800 500)">
    <!-- Outer Cyan HUD Ring -->
    <circle cx="0" cy="0" r="280" fill="none" stroke="#05d9e8" stroke-width="2" stroke-dasharray="30 15 8 15" opacity="0.8"/>
    <circle cx="0" cy="0" r="250" fill="none" stroke="#f9f002" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6"/>
    <circle cx="0" cy="0" r="180" fill="none" stroke="#05d9e8" stroke-width="3"/>
    
    <!-- Targeting Crosshairs and Brackets -->
    <path d="M -120 -180 L -180 -180 L -180 -120" fill="none" stroke="#f9f002" stroke-width="6"/>
    <path d="M 120 -180 L 180 -180 L 180 -120" fill="none" stroke="#f9f002" stroke-width="6"/>
    <path d="M -120 180 L -180 180 L -180 120" fill="none" stroke="#f9f002" stroke-width="6"/>
    <path d="M 120 180 L 180 180 L 180 120" fill="none" stroke="#f9f002" stroke-width="6"/>

    <line x1="-220" y1="0" x2="-60" y2="0" stroke="#05d9e8" stroke-width="3"/>
    <line x1="60" y1="0" x2="220" y2="0" stroke="#05d9e8" stroke-width="3"/>
    <line x1="0" y1="-220" x2="0" y2="-60" stroke="#05d9e8" stroke-width="3"/>
    <line x1="0" y1="60" x2="0" y2="220" stroke="#05d9e8" stroke-width="3"/>
    <circle cx="0" cy="0" r="14" fill="#f9f002"/>

    <!-- Compass degree ticks -->
    <line x1="0" y1="-280" x2="0" y2="-260" stroke="#05d9e8" stroke-width="4"/>
    <line x1="280" y1="0" x2="260" y2="0" stroke="#05d9e8" stroke-width="4"/>
    <line x1="0" y1="280" x2="0" y2="260" stroke="#05d9e8" stroke-width="4"/>
    <line x1="-280" y1="0" x2="-260" y2="0" stroke="#05d9e8" stroke-width="4"/>
  </g>

  <!-- HUD Telemetry Readouts and Diagnostics -->
  <g font-family="'JetBrains Mono', monospace" font-size="20" fill="#f2f5f7">
    <rect x="420" y="80" width="340" height="38" fill="#15151d" stroke="#f9f002" stroke-width="2"/>
    <text x="440" y="106" fill="#f9f002" font-weight="bold">TARGET_LOCK: 98.4% [ACTIVE]</text>
    
    <rect x="840" y="80" width="320" height="38" fill="#15151d" stroke="#05d9e8" stroke-width="2"/>
    <text x="860" y="106" fill="#05d9e8">GRID_SECTOR: // 2077-NEO</text>

    <!-- Side Data Bars -->
    <g transform="translate(180 540)">
      <text x="0" y="0" fill="#f9f002" font-size="16">SHIELD_INTEG</text>
      <rect x="0" y="12" width="180" height="12" fill="#15151d" stroke="#f9f002" stroke-width="1"/>
      <rect x="0" y="12" width="145" height="12" fill="#f9f002"/>
      <text x="0" y="55" fill="#05d9e8" font-size="16">SYNAPSE_LOAD</text>
      <rect x="0" y="67" width="180" height="12" fill="#15151d" stroke="#05d9e8" stroke-width="1"/>
      <rect x="0" y="67" width="165" height="12" fill="#05d9e8"/>
    </g>

    <!-- Barcode and Warning Stamp -->
    <g transform="translate(1180 540)">
      <rect x="0" y="0" width="220" height="45" fill="#f9f002"/>
      <text x="18" y="30" fill="#0b0b0f" font-weight="bold" font-size="24">DANGER: HIGH V</text>
      <!-- Simulated Barcode -->
      <g fill="#05d9e8" transform="translate(0 70)">
        <rect x="0" y="0" width="6" height="40"/><rect x="10" y="0" width="12" height="40"/><rect x="28" y="0" width="4" height="40"/><rect x="36" y="0" width="16" height="40"/>
        <rect x="58" y="0" width="8" height="40"/><rect x="72" y="0" width="4" height="40"/><rect x="82" y="0" width="18" height="40"/><rect x="106" y="0" width="10" height="40"/>
        <rect x="122" y="0" width="6" height="40"/><rect x="134" y="0" width="14" height="40"/><rect x="154" y="0" width="8" height="40"/><rect x="168" y="0" width="18" height="40"/>
      </g>
    </g>
  </g>
</svg>