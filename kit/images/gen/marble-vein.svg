<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="mv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f3" />
      <stop offset="50%" stop-color="#fdfdfc" />
      <stop offset="100%" stop-color="#e8eae8" />
    </linearGradient>
    <linearGradient id="mv-plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfdfc" />
      <stop offset="100%" stop-color="#f0f2f0" />
    </linearGradient>
    <linearGradient id="mv-vein1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242b2e" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#14181a" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#4c565a" stop-opacity="0.75" />
    </linearGradient>
    <filter id="mv-shadow">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#14181a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Canvas background -->
  <rect width="1600" height="1000" fill="url(#mv-bg)" />

  <!-- Geological grid lines in faint grey -->
  <g stroke="#748083" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 8">
    <line x1="120" y1="200" x2="1480" y2="200" />
    <line x1="120" y1="400" x2="1480" y2="400" />
    <line x1="120" y1="600" x2="1480" y2="600" />
    <line x1="120" y1="800" x2="1480" y2="800" />
    <line x1="400" y1="80" x2="400" y2="920" />
    <line x1="800" y1="80" x2="800" y2="920" />
    <line x1="1200" y1="80" x2="1200" y2="920" />
  </g>

  <!-- Honed Marble Slab Block -->
  <g filter="url(#mv-shadow)">
    <rect x="140" y="100" width="1320" height="800" rx="8" fill="url(#mv-plate)" stroke="#748083" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <!-- Calcite and Breccia Soft Shading Fields -->
  <path d="M 140 320 Q 380 260 520 400 T 890 380 T 1200 240 L 1460 210 L 1460 100 L 140 100 Z" fill="#e8eae8" opacity="0.45" />
  <path d="M 320 900 Q 640 760 900 840 T 1460 780 L 1460 900 Z" fill="#f0f2f0" opacity="0.6" />

  <!-- Major Branching Vein 1 (Carrara Graphite Primary Fracture) -->
  <path d="M 140 220 C 310 240, 390 190, 520 280 C 620 350, 710 320, 840 450 C 960 570, 1080 540, 1220 680 C 1340 800, 1410 820, 1460 880" fill="none" stroke="url(#mv-vein1)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Parallel vein core -->
  <path d="M 140 220 C 310 240, 390 190, 520 280 C 620 350, 710 320, 840 450 C 960 570, 1080 540, 1220 680 C 1340 800, 1410 820, 1460 880" fill="none" stroke="#14181a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Secondary Vein Branches -->
  <path d="M 520 280 C 580 220, 690 180, 810 150 C 890 130, 960 110, 1020 100" fill="none" stroke="#4c565a" stroke-width="3" stroke-opacity="0.8" stroke-linecap="round" />
  <path d="M 720 174 C 770 210, 850 240, 920 220" fill="none" stroke="#748083" stroke-width="1.5" stroke-opacity="0.7" />
  <path d="M 840 450 C 880 520, 890 620, 870 730 C 850 820, 790 870, 750 900" fill="none" stroke="#242b2e" stroke-width="4" stroke-opacity="0.8" stroke-linecap="round" />
  <path d="M 870 580 C 930 630, 990 660, 1070 650" fill="none" stroke="#4c565a" stroke-width="2" stroke-opacity="0.75" />
  <path d="M 1080 540 C 1140 480, 1260 440, 1370 410 L 1460 390" fill="none" stroke="#4c565a" stroke-width="2.5" stroke-opacity="0.7" stroke-linecap="round" />

  <!-- Tertiary Micro-Vein Hairlines -->
  <path d="M 280 230 C 340 310, 420 370, 460 460 C 490 530, 520 610, 560 670" fill="none" stroke="#748083" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round" />
  <path d="M 1220 680 C 1270 620, 1320 590, 1420 570" fill="none" stroke="#748083" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round" />
  <path d="M 980 500 C 1020 440, 1060 410, 1140 370" fill="none" stroke="#4c565a" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Stone Specimen Identification Plaque -->
  <g transform="translate(190, 140)">
    <rect width="360" height="96" rx="4" fill="#ffffff" stroke="#748083" stroke-width="1" stroke-opacity="0.5" />
    <text x="20" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#748083" letter-spacing="2">LITHIC SPECIMEN NO. 126</text>
    <text x="20" y="58" font-family="'Lora', Georgia, serif" font-size="20" font-weight="700" fill="#14181a">Carrara Graphite Vein</text>
    <text x="20" y="80" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4c565a">MOHS 3.5 · DENSITY 2.71 g/cm³ · BLOCK B-04</text>
  </g>

  <!-- Scale Bar & Compass -->
  <g transform="translate(190, 830)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="#14181a" stroke-width="2" />
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#14181a" stroke-width="2" />
    <line x1="50" y1="-4" x2="50" y2="4" stroke="#14181a" stroke-width="1.5" />
    <line x1="100" y1="-6" x2="100" y2="6" stroke="#14181a" stroke-width="1.5" />
    <line x1="150" y1="-4" x2="150" y2="4" stroke="#14181a" stroke-width="1.5" />
    <line x1="200" y1="-6" x2="200" y2="6" stroke="#14181a" stroke-width="2" />
    <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#14181a">0</text>
    <text x="90" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#14181a">25 cm</text>
    <text x="185" y="24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#14181a">50 cm</text>
  </g>

  <!-- Corner Alignment Marks -->
  <g stroke="#242b2e" stroke-width="1.5" fill="none">
    <path d="M 155 125 L 155 115 L 125 115" />
    <path d="M 1445 125 L 1445 115 L 1475 115" />
    <path d="M 155 875 L 155 885 L 125 885" />
    <path d="M 1445 875 L 1445 885 L 1475 885" />
  </g>
</svg>
