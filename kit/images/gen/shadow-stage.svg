<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="spotCone" x1="800" y1="0" x2="800" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e3b341" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#e3b341" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e3b341" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="stagePool" cx="800" cy="750" r="480" fx="800" fy="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e3b341" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#e3b341" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#12151a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#12151a"/>

  <!-- Stage perspective grid lines -->
  <g stroke="#eef1f5" stroke-width="1.5" opacity="0.12">
    <line x1="800" y1="460" x2="0" y2="1000"/>
    <line x1="800" y1="460" x2="250" y2="1000"/>
    <line x1="800" y1="460" x2="550" y2="1000"/>
    <line x1="800" y1="460" x2="800" y2="1000"/>
    <line x1="800" y1="460" x2="1050" y2="1000"/>
    <line x1="800" y1="460" x2="1350" y2="1000"/>
    <line x1="800" y1="460" x2="1600" y2="1000"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="0" y1="860" x2="1600" y2="860"/>
  </g>

  <!-- Illuminated Stage Floor Pool -->
  <ellipse cx="800" cy="740" rx="550" ry="180" fill="url(#stagePool)"/>

  <!-- Cast Shadow Wedge (Extending from form base to bottom right) -->
  <polygon points="680,680 880,680 1520,940 1020,940" fill="#080a0d" opacity="0.92"/>

  <!-- Conic Spotlight Beam from Ceiling -->
  <polygon points="760,0 840,0 1350,1000 250,1000" fill="url(#spotCone)"/>

  <!-- Standing Monolith Cylinder / Prism on Stage -->
  <g>
    <path d="M 680 400 L 780 400 L 780 680 L 680 680 Z" fill="#171b21"/>
    <path d="M 780 400 L 880 400 L 880 680 L 780 680 Z" fill="#232a33"/>
    <ellipse cx="780" cy="400" rx="100" ry="32" fill="#e3b341" opacity="0.85"/>
    <ellipse cx="780" cy="400" rx="88" ry="26" fill="#1b2028"/>
    <line x1="880" y1="400" x2="880" y2="680" stroke="#e3b341" stroke-width="4"/>
  </g>

  <!-- Stage Lighting HUD Callout -->
  <text x="100" y="100" font-family="'Poiret One', 'Inter', sans-serif" font-size="34" font-weight="700" fill="#eef1f5" letter-spacing="4">
    SHADOW STAGE 101
  </text>
  <text x="100" y="135" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#e3b341" letter-spacing="2">
    AZIMUTH: 38° · ELEVATION: 62° · LUX: 2800 · CAST ANGLE: 45°
  </text>
</svg>