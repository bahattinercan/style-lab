<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b6491" />
      <stop offset="35%" stop-color="#5a8db8" />
      <stop offset="70%" stop-color="#b4cee2" />
      <stop offset="100%" stop-color="#eef2f7" />
    </linearGradient>
    <radialGradient id="sun-haze" cx="78%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#fff8e8" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#2b6491" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cloud-mass-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#dce6f0" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="cloud-mass-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6f9fc" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#b6cbe0" stop-opacity="0.65" />
    </linearGradient>
  </defs>

  <!-- Sky Gradient Field -->
  <rect width="1600" height="1000" fill="url(#sky-grad)" />

  <!-- Sun Haze High-Altitude Luminosity -->
  <rect width="1600" height="1000" fill="url(#sun-haze)" />

  <!-- Atmospheric Pressure Isobar Curves with Millibar Labels -->
  <g stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.45" fill="none">
    <path d="M -100,240 C 300,180 700,320 1100,220 C 1300,170 1500,210 1700,160" />
    <path d="M -100,340 C 280,290 680,410 1080,310 C 1320,250 1520,300 1700,260" />
    <path d="M -100,450 C 260,400 660,510 1050,420 C 1300,360 1500,420 1700,380" />
    <path d="M -100,570 C 240,530 640,620 1030,540 C 1280,490 1490,560 1700,510" />
  </g>
  <g font-family="'Space Mono', monospace" font-size="11" fill="#ffffff" fill-opacity="0.75" letter-spacing="1">
    <text x="320" y="215">1024 hPa</text>
    <text x="300" y="325">1020 hPa</text>
    <text x="280" y="435">1016 hPa</text>
    <text x="260" y="555">1012 hPa</text>
  </g>

  <!-- Cumulonimbus / Stratocumulus Mass Volumes (Middle Right to Center) -->
  <g>
    <!-- Background Cloud Puff Cluster -->
    <path d="M 620,680 C 600,560 720,440 850,460 C 900,380 1050,360 1160,420 C 1240,360 1380,380 1420,480 C 1510,500 1560,600 1520,690 Z" fill="url(#cloud-mass-2)" />
    <!-- Foreground Volumetric Cloud Bank -->
    <path d="M 440,780 C 420,640 560,520 700,540 C 760,440 920,420 1040,490 C 1140,430 1280,460 1340,560 C 1440,580 1500,680 1460,780 Z" fill="url(#cloud-mass-1)" />
  </g>

  <!-- Horizontal Mist & Stratus Vapor Bands (Filtering across the lower horizon) -->
  <g opacity="0.65">
    <rect x="0" y="680" width="1600" height="45" fill="#ffffff" opacity="0.4" />
    <rect x="0" y="740" width="1600" height="70" fill="#f6f9fc" opacity="0.55" />
    <rect x="0" y="830" width="1600" height="110" fill="#eef2f7" opacity="0.7" />
  </g>

  <!-- Meteorological Barometric Front Markers & Wind Vector Barbs -->
  <g stroke="#1a2430" stroke-width="1.6" stroke-opacity="0.45" fill="none">
    <!-- Cold Front Triangle Teeth along upper isobar -->
    <polygon points="680,245 700,230 720,250" fill="#2b6491" stroke="#2b6491" stroke-width="1" />
    <polygon points="820,270 840,255 860,275" fill="#2b6491" stroke="#2b6491" stroke-width="1" />
    <polygon points="960,260 980,245 1000,265" fill="#2b6491" stroke="#2b6491" stroke-width="1" />
    <!-- Wind vector barbs (Speed 25 knots) -->
    <g transform="translate(1320, 220) rotate(-45)">
      <line x1="0" y1="0" x2="60" y2="0" />
      <line x1="60" y1="0" x2="50" y2="-18" />
      <line x1="48" y1="0" x2="38" y2="-18" />
      <line x1="36" y1="0" x2="30" y2="-12" />
    </g>
    <g transform="translate(1440, 320) rotate(-35)">
      <line x1="0" y1="0" x2="60" y2="0" />
      <line x1="60" y1="0" x2="50" y2="-18" />
      <line x1="48" y1="0" x2="38" y2="-18" />
    </g>
  </g>

  <!-- Header Meteorology Telemetry at Top Left -->
  <g transform="translate(100, 90)">
    <text x="0" y="32" font-family="'Poppins', sans-serif" font-size="32" font-weight="600" fill="#ffffff" letter-spacing="-0.5">ATMOSPHERE &amp; TROPOSPHERE // 077</text>
    <text x="0" y="64" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#ffffff" fill-opacity="0.9" letter-spacing="2">SYNOPTIC CHART · STRATOCUMULUS &amp; BAROMETRIC GRADIENT</text>
    <text x="0" y="88" font-family="'Space Mono', monospace" font-size="12" fill="#eef2f7" letter-spacing="1.5">ALTITUDE: 2,400m MSL · RELATIVE HUMIDITY: 88% · DEW POINT: 6.4°C · ALBEDO: 0.62</text>
  </g>

  <!-- Altitude Scale on Left Edge -->
  <g transform="translate(50, 220)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6">
    <line x1="20" y1="0" x2="20" y2="400" />
    <line x1="12" y1="0" x2="20" y2="0" />
    <line x1="15" y1="100" x2="20" y2="100" />
    <line x1="12" y1="200" x2="20" y2="200" />
    <line x1="15" y1="300" x2="20" y2="300" />
    <line x1="12" y1="400" x2="20" y2="400" />
    <text x="28" y="5" font-family="'Space Mono', monospace" font-size="10" fill="#ffffff" stroke="none">8 km</text>
    <text x="28" y="105" font-family="'Space Mono', monospace" font-size="10" fill="#ffffff" stroke="none">6 km</text>
    <text x="28" y="205" font-family="'Space Mono', monospace" font-size="10" fill="#ffffff" stroke="none">4 km</text>
    <text x="28" y="305" font-family="'Space Mono', monospace" font-size="10" fill="#ffffff" stroke="none">2 km</text>
    <text x="28" y="405" font-family="'Space Mono', monospace" font-size="10" fill="#ffffff" stroke="none">0 km</text>
  </g>
</svg>