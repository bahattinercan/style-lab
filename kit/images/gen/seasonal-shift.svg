<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="season-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6efe2" />
      <stop offset="50%" stop-color="#ede3d2" />
      <stop offset="100%" stop-color="#e2cfb7" />
    </linearGradient>
    <linearGradient id="canopy-summer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#608343" />
      <stop offset="100%" stop-color="#3c5726" />
    </linearGradient>
    <linearGradient id="canopy-autumn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d96c32" />
      <stop offset="50%" stop-color="#a4471f" />
      <stop offset="100%" stop-color="#6d2b0e" />
    </linearGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1600" height="1000" fill="url(#season-bg)" />

  <!-- Diagonal Equinox Boundary Arc / Transition Meridian -->
  <path d="M 300,1000 C 650,750 950,450 1300,0" stroke="#a4471f" stroke-width="2" stroke-dasharray="10 6" fill="none" opacity="0.6" />

  <!-- Summer Foliage Canopy Mass on Left -->
  <path d="M 0,260 C 180,240 320,340 440,460 C 560,580 620,740 640,1000 L 0,1000 Z" fill="url(#canopy-summer)" opacity="0.88" />

  <!-- Autumn Foliage Canopy Mass on Right (Warm Rust Orange) -->
  <path d="M 1600,200 C 1380,220 1200,360 1080,520 C 960,680 920,840 900,1000 L 1600,1000 Z" fill="url(#canopy-autumn)" opacity="0.9" />

  <!-- Falling Deciduous Leaf Vector Silhouettes Drift (Stippled Across the Transition) -->
  <g fill="#a4471f" opacity="0.85">
    <path d="M 780,280 C 800,250 830,260 840,290 C 850,320 810,340 780,330 C 760,310 760,290 780,280 Z" transform="rotate(25 780 280)" />
    <path d="M 880,360 C 895,335 925,345 930,370 C 935,395 905,410 880,400 C 865,385 865,370 880,360 Z" transform="rotate(-18 880 360)" />
    <path d="M 720,440 C 735,415 765,425 770,450 C 775,475 745,490 720,480 C 705,465 705,450 720,440 Z" transform="rotate(45 720 440)" />
    <path d="M 820,530 C 840,500 875,510 880,540 C 885,570 850,590 820,580 C 800,560 800,540 820,530 Z" transform="rotate(-32 820 530)" />
    <path d="M 940,620 C 955,595 985,605 990,630 C 995,655 965,670 940,660 C 925,645 925,630 940,620 Z" transform="rotate(15 940 620)" />
  </g>
  <g fill="#608343" opacity="0.75">
    <path d="M 640,350 C 655,325 685,335 690,360 C 695,385 665,400 640,390 C 625,375 625,360 640,350 Z" transform="rotate(-20 640 350)" />
    <path d="M 580,480 C 595,455 625,465 630,490 C 635,515 605,530 580,520 C 565,505 565,490 580,480 Z" transform="rotate(35 580 480)" />
  </g>

  <!-- Sparse Dot Drift Matrix Representing Temperature Drift -->
  <g fill="#2a2018" opacity="0.35">
    <circle cx="500" cy="220" r="3" />
    <circle cx="580" cy="240" r="3" />
    <circle cx="660" cy="210" r="3.5" />
    <circle cx="740" cy="230" r="4" />
    <circle cx="820" cy="190" r="4.5" />
    <circle cx="900" cy="220" r="5" />
    <circle cx="980" cy="180" r="5.5" />
    <circle cx="1060" cy="210" r="6" />
    <circle cx="1140" cy="170" r="6.5" />
  </g>

  <!-- Phenology Temperature Sine Curve (Autumn Transition) -->
  <path d="M 200,600 Q 550,520 850,680 T 1500,820" stroke="#2a2018" stroke-width="1.8" stroke-opacity="0.5" fill="none" />

  <!-- Seasonal Shift Title & Ephemeris Header at Top Left -->
  <g transform="translate(100, 95)">
    <text x="0" y="32" font-family="'EB Garamond', Georgia, serif" font-size="36" font-style="italic" font-weight="600" fill="#2a2018" letter-spacing="-0.5">Seasonal Shift // 080</text>
    <text x="0" y="62" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#a4471f" letter-spacing="3">AUTUMN EQUINOX TRANSITION · DAY 264 // PHENOLOGY CYCLE</text>
    <text x="0" y="86" font-family="'JetBrains Mono', monospace" font-size="12" fill="#5c4c3d" letter-spacing="1.5">SOLAR DECLINATION: 0°00' · MEAN TEMP: 24.2°C → 13.8°C · CANOPY ANTHOCYANIN: 78%</text>
  </g>

  <!-- Solar Trajectory Arc Indicator at Top Right -->
  <g transform="translate(1320, 100)" stroke="#a4471f" stroke-width="1.5" fill="none">
    <path d="M 0,60 A 80,80 0 0,1 160,60" />
    <circle cx="80" cy="-20" r="6" fill="#a4471f" />
    <line x1="80" y1="60" x2="80" y2="75" stroke="#2a2018" stroke-width="1" />
    <text x="80" y="95" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2a2018" stroke="none" text-anchor="middle">EQUINOX 0°</text>
  </g>
</svg>