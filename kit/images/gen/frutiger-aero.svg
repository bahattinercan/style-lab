<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="fa-sky" x1="0" y1="0" x2="0" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4aa8ec"/>
      <stop offset="35%" stop-color="#7ec4f5"/>
      <stop offset="70%" stop-color="#dff1ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="fa-hill1" x1="0" y1="500" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ad94a"/>
      <stop offset="50%" stop-color="#3fb825"/>
      <stop offset="100%" stop-color="#1e7512"/>
    </linearGradient>
    <linearGradient id="fa-hill2" x1="0" y1="560" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#88eb59"/>
      <stop offset="60%" stop-color="#4dbb2c"/>
      <stop offset="100%" stop-color="#236614"/>
    </linearGradient>
    <radialGradient id="fa-bubble" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#dff1ff" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#2090d5" stop-opacity="0.35"/>
      <stop offset="95%" stop-color="#2090d5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="fa-sunburst" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#dff1ff" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#7ec4f5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4aa8ec" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="1000" fill="url(#fa-sky)"/>

  <!-- Sunburst Flare Top Left -->
  <circle cx="320" cy="200" r="380" fill="url(#fa-sunburst)"/>
  <line x1="0" y1="200" x2="640" y2="200" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="320" y1="0" x2="320" y2="400" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

  <!-- Fluffy Skeuomorphic Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M 120 280 Q 150 220 220 230 Q 280 180 360 210 Q 420 200 460 250 Q 520 270 500 320 L 140 320 Z"/>
    <path d="M 1120 200 Q 1160 140 1240 150 Q 1300 110 1380 140 Q 1460 130 1500 180 Q 1560 200 1540 250 L 1140 250 Z"/>
  </g>

  <!-- Glossy Green Hills -->
  <!-- Back Hill -->
  <path d="M -100 700 Q 300 480 800 580 Q 1300 680 1700 520 L 1700 1000 L -100 1000 Z" fill="url(#fa-hill1)"/>
  <!-- Front Hill with Gloss Rim -->
  <path d="M -100 620 Q 400 620 900 520 Q 1400 420 1700 640 L 1700 1000 L -100 1000 Z" fill="url(#fa-hill2)"/>
  <!-- Gloss highlight arc along the crest -->
  <path d="M -100 620 Q 400 620 900 520 Q 1400 420 1700 640" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.6"/>

  <!-- Translucent Glass Aero Pill / Dock at Bottom Center -->
  <g transform="translate(500 840)">
    <rect width="600" height="90" rx="45" fill="#ffffff" opacity="0.55" stroke="#ffffff" stroke-width="3"/>
    <!-- Upper half glossy dome highlight -->
    <path d="M 45 4 Q 300 15 555 4 Q 590 20 585 45 L 15 45 Q 10 20 45 4 Z" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Floating Glossy Glass Spheres / Bubbles with Specular Highlights -->
  <!-- Giant Main Glass Sphere Center -->
  <g transform="translate(800 460)">
    <circle cx="0" cy="0" r="240" fill="url(#fa-bubble)"/>
    <!-- Outer glass rim light -->
    <circle cx="0" cy="0" r="238" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
    
    <!-- Top-left curved gloss dome reflection -->
    <ellipse cx="-70" cy="-90" rx="110" ry="55" fill="#ffffff" opacity="0.8" transform="rotate(-30 -70 -90)"/>
    <ellipse cx="-80" cy="-105" rx="70" ry="25" fill="#ffffff" opacity="0.95" transform="rotate(-30 -80 -105)"/>
    
    <!-- Bottom-right inner refraction glow -->
    <ellipse cx="80" cy="110" rx="90" ry="35" fill="#2090d5" opacity="0.5" transform="rotate(-30 80 110)"/>
    <ellipse cx="90" cy="120" rx="60" ry="18" fill="#ffffff" opacity="0.7" transform="rotate(-30 90 120)"/>
  </g>

  <!-- Smaller Floating Water Droplets -->
  <g transform="translate(380 400)">
    <circle cx="0" cy="0" r="75" fill="url(#fa-bubble)"/>
    <circle cx="0" cy="0" r="74" fill="none" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="-20" cy="-28" rx="30" ry="14" fill="#ffffff" opacity="0.9" transform="rotate(-30 -20 -28)"/>
  </g>

  <g transform="translate(1240 380)">
    <circle cx="0" cy="0" r="90" fill="url(#fa-bubble)"/>
    <circle cx="0" cy="0" r="89" fill="none" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="-25" cy="-35" rx="36" ry="18" fill="#ffffff" opacity="0.9" transform="rotate(-30 -25 -35)"/>
  </g>

  <g transform="translate(1360 580)">
    <circle cx="0" cy="0" r="45" fill="url(#fa-bubble)"/>
    <ellipse cx="-12" cy="-18" rx="18" ry="9" fill="#ffffff" opacity="0.9" transform="rotate(-30 -12 -18)"/>
  </g>
  <g transform="translate(300 620)">
    <circle cx="0" cy="0" r="50" fill="url(#fa-bubble)"/>
    <ellipse cx="-15" cy="-20" rx="20" ry="10" fill="#ffffff" opacity="0.9" transform="rotate(-30 -15 -20)"/>
  </g>
</svg>