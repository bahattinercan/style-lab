<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="ocean-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2029" />
      <stop offset="50%" stop-color="#06161d" />
      <stop offset="100%" stop-color="#020b0e" />
    </linearGradient>
    <linearGradient id="trench-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46d8c4" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#1b7268" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0a2029" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="stream-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1da899" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#46d8c4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#dff0f4" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#ocean-bg)" />

  <!-- Bathymetric Shelf Gradient Underlayer -->
  <path d="M 0,380 C 350,320 600,480 950,420 C 1250,360 1420,440 1600,390 L 1600,1000 L 0,1000 Z" fill="url(#trench-glow)" />

  <!-- Bathymetric Depth Sounding Contour Curves -->
  <g fill="none" stroke-opacity="0.35">
    <path d="M 0,280 C 320,240 680,360 1020,300 C 1300,250 1480,310 1600,270" stroke="#46d8c4" stroke-width="1" />
    <path d="M 0,380 C 350,320 720,460 1060,390 C 1320,330 1490,410 1600,360" stroke="#46d8c4" stroke-width="1.4" />
    <path d="M 0,490 C 380,420 750,560 1100,480 C 1350,420 1500,510 1600,460" stroke="#46d8c4" stroke-width="1.8" />
    <path d="M 0,610 C 400,540 780,680 1140,590 C 1370,520 1510,620 1600,570" stroke="#46d8c4" stroke-width="1.2" />
    <path d="M 0,740 C 420,680 810,800 1180,710 C 1400,640 1520,730 1600,690" stroke="#46d8c4" stroke-width="1" />
  </g>

  <!-- Flowing Pelagic Streamlines (Sinuous High-Speed Ocean Drift Lines) -->
  <g fill="none" stroke-linecap="round">
    <path d="M -50,340 C 320,220 540,540 980,360 C 1320,220 1480,420 1650,300" stroke="url(#stream-accent)" stroke-width="4.5" />
    <path d="M -50,380 C 330,260 560,570 1000,390 C 1340,250 1490,450 1650,330" stroke="url(#stream-accent)" stroke-width="3" stroke-opacity="0.8" />
    <path d="M -50,420 C 340,300 580,600 1020,420 C 1360,280 1500,480 1650,360" stroke="url(#stream-accent)" stroke-width="2" stroke-opacity="0.6" />
    <path d="M -50,455 C 350,335 595,625 1035,445 C 1375,305 1510,505 1650,385" stroke="#46d8c4" stroke-width="1.2" stroke-opacity="0.45" />
  </g>

  <!-- Swirling Mesoscale Ocean Eddies (Concentric Streamline Vortices) -->
  <g transform="translate(1180, 580)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#46d8c4" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#46d8c4" stroke-width="1.5" stroke-opacity="0.45" stroke-dasharray="12 4" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#46d8c4" stroke-width="2" stroke-opacity="0.75" />
    <circle cx="0" cy="0" r="24" fill="none" stroke="#dff0f4" stroke-width="2.5" />
    <circle cx="0" cy="0" r="6" fill="#46d8c4" />
    <!-- Eddy tangential velocity arrows -->
    <path d="M 0,-60 L 14,-66 L 4,-50 Z" fill="#46d8c4" />
    <path d="M 60,0 L 66,14 L 50,4 Z" fill="#46d8c4" />
    <path d="M 0,60 L -14,66 L -4,50 Z" fill="#46d8c4" />
    <path d="M -60,0 L -66,-14 L -50,-4 Z" fill="#46d8c4" />
    <text x="20" y="-75" font-family="'Courier Prime', monospace" font-size="11" fill="#46d8c4">CYCLONIC EDDY · 0.8 m/s</text>
  </g>

  <!-- Bathymetric Depth Labels & Soundings -->
  <g font-family="'Courier Prime', monospace" font-size="11" fill="#a3c4cd" letter-spacing="1">
    <text x="750" y="325">- 1200 m</text>
    <text x="820" y="430">- 2400 m</text>
    <text x="880" y="530">- 3800 m</text>
    <text x="940" y="640">- 4800 m</text>
    <text x="980" y="750">- 5600 m [ABYSSAL]</text>
  </g>

  <!-- Oceanographic Header at Top Left -->
  <g transform="translate(100, 90)">
    <text x="0" y="32" font-family="'Cormorant Garamond', Georgia, serif" font-size="36" font-style="italic" font-weight="600" fill="#dff0f4" letter-spacing="0">Ocean Current Dynamics // 079</text>
    <text x="0" y="62" font-family="'Lora', Georgia, serif" font-size="14" font-weight="600" fill="#46d8c4" letter-spacing="3">THERMOHALINE CIRCULATION &amp; PELAGIC GYRE DRIFT</text>
    <text x="0" y="86" font-family="'Courier Prime', monospace" font-size="12" fill="#6f939d" letter-spacing="1.5">LAT: 32°14'S · LON: 110°28'E · DRIFT: 3.4 KNOTS · SEA SURFACE TEMP: 18.6°C · S: 35.2 PSU</text>
  </g>
</svg>