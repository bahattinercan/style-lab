<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
<!-- Oceanic Navy Canvas -->
  <rect width="1600" height="1000" fill="#0d1520" />

  <!-- Outer Console Border -->
  <rect x="60" y="40" width="1480" height="920" fill="#14202e" stroke="#253448" stroke-width="2" />

  <!-- Header -->
  <rect x="60" y="40" width="1480" height="50" fill="#1a2836" />
  <text x="90" y="72" fill="#7fa8f0" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="2">ATLAS CONSOLE // GLOBAL TACTICAL GRATICULE</text>
  <text x="1340" y="72" fill="#a7b7cb" font-family="monospace" font-size="13">COORD SYS: WGS-84</text>

  <!-- Spherical Graticule Disk -->
  <circle cx="800" cy="500" r="350" fill="#0d1520" stroke="#7fa8f0" stroke-width="3" />
  <!-- Center Crosshairs -->
  <line x1="400" y1="500" x2="1200" y2="500" stroke="#7fa8f0" stroke-width="2" />
  <line x1="800" y1="100" x2="800" y2="900" stroke="#7fa8f0" stroke-width="2" />
  <line x1="450" y1="200" x2="1150" y2="200" stroke="#7fa8f0" stroke-width="1" stroke-opacity="0.35" />
<line x1="450" y1="260" x2="1150" y2="260" stroke="#7fa8f0" stroke-width="1" stroke-opacity="0.35" />
<line x1="450" y1="320" x2="1150" y2="320" stroke="#7fa8f0" stroke-width="1" stroke-opacity="0.35" />
<line x1="450" y1="380" x2="1150" y2="380" stroke="#7fa8f0" stroke-width="1" stroke-opacity="0.35" />
<line x1="450" y1="440" x2="1150" y2="440" stroke="#7fa8f0" stroke-width="1" stroke-opacity="0.35" />
<line x1="450" y1="500" x2="1150" y2="500" stroke="#7fa8f0" stroke-width="1" stroke-opacity="0.35" />
<line x1="450" y1="560" x2="1150" y2="560" stroke="#7fa8f0" stroke-width="1" stroke-opacity="0.35" />
<line x1="450" y1="620" x2="1150" y2="620" stroke="#7fa8f0" stroke-width="1" stroke-opacity="0.35" />
<line x1="450" y1="680" x2="1150" y2="680" stroke="#7fa8f0" stroke-width="1" stroke-opacity="0.35" />
<line x1="450" y1="740" x2="1150" y2="740" stroke="#7fa8f0" stroke-width="1" stroke-opacity="0.35" />
<line x1="450" y1="800" x2="1150" y2="800" stroke="#7fa8f0" stroke-width="1" stroke-opacity="0.35" />

  <ellipse cx="800" cy="500" rx="70" ry="350" fill="none" stroke="#7fa8f0" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="6 4" />
<ellipse cx="800" cy="500" rx="140" ry="350" fill="none" stroke="#7fa8f0" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="6 4" />
<ellipse cx="800" cy="500" rx="210" ry="350" fill="none" stroke="#7fa8f0" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="6 4" />
<ellipse cx="800" cy="500" rx="280" ry="350" fill="none" stroke="#7fa8f0" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="6 4" />
<ellipse cx="800" cy="500" rx="350" ry="350" fill="none" stroke="#7fa8f0" stroke-width="1" stroke-opacity="0.45" stroke-dasharray="6 4" />


  <!-- Simplified Vector Continent Polygons -->
  <!-- Landmass 1: Americas shape -->
  <polygon points="560,320 620,360 640,440 600,480 640,560 620,640 580,720 540,660 520,540 500,420 530,340" fill="#1a2836" stroke="#7fa8f0" stroke-width="2" />
  <!-- Landmass 2: Eurasia/Africa shape -->
  <polygon points="760,260 880,240 980,280 1020,380 940,440 920,560 880,680 820,620 800,460 720,380" fill="#1a2836" stroke="#7fa8f0" stroke-width="2" />

  <!-- Compass Rose in Upper Left -->
  <g transform="translate(220, 240)">
    <circle cx="0" cy="0" r="80" fill="#0d1520" stroke="#7fa8f0" stroke-width="1.5" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#253448" stroke-width="1" />
    <!-- 8 points star -->
    <polygon points="0,-75 14,-20 75,0 14,20 0,75 -14,20 -75,0 -14,-20" fill="#7fa8f0" />
    <polygon points="0,-75 0,0 -75,0" fill="#ffffff" fill-opacity="0.4" />
    <text x="0" y="-85" font-family="monospace" font-size="14" font-weight="bold" fill="#7fa8f0" text-anchor="middle">N</text>
    <text x="95" y="5" font-family="monospace" font-size="14" font-weight="bold" fill="#7fa8f0">E</text>
    <text x="0" y="100" font-family="monospace" font-size="14" font-weight="bold" fill="#7fa8f0" text-anchor="middle">S</text>
    <text x="-105" y="5" font-family="monospace" font-size="14" font-weight="bold" fill="#7fa8f0">W</text>
  </g>

  <!-- Waypoints and Tactical Vectors -->
  <circle cx="680" cy="420" r="8" fill="#ff8a70" />
  <circle cx="680" cy="420" r="22" fill="none" stroke="#ff8a70" stroke-width="1.5" stroke-dasharray="4 2" />
  <text x="705" y="415" font-family="monospace" font-size="12" font-weight="bold" fill="#ff8a70">ALPHA-01 [34°N, 18°W]</text>

  <circle cx="920" cy="380" r="8" fill="#7fd4a8" />
  <circle cx="920" cy="380" r="22" fill="none" stroke="#7fd4a8" stroke-width="1.5" stroke-dasharray="4 2" />
  <text x="945" y="375" font-family="monospace" font-size="12" font-weight="bold" fill="#7fd4a8">BRAVO-02 [52°N, 14°E]</text>

  <!-- Tactical Vector Path -->
  <line x1="680" y1="420" x2="920" y2="380" stroke="#f0c46a" stroke-width="2.5" stroke-dasharray="8 4" />

  <!-- Side Navigation Data Panels -->
  <!-- Left Panel -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="240" height="200" fill="#1a2836" stroke="#253448" rx="4" />
    <text x="20" y="30" font-family="monospace" font-size="12" fill="#7fa8f0" font-weight="bold">TARGET AZIMUTH</text>
    <text x="20" y="70" font-family="monospace" font-size="32" font-weight="bold" fill="#e9eef6">064.2°</text>
    <text x="20" y="110" font-family="monospace" font-size="12" fill="#7fa8f0" font-weight="bold">RANGE VECTOR</text>
    <text x="20" y="150" font-family="monospace" font-size="32" font-weight="bold" fill="#f0c46a">1,480 NM</text>
  </g>

  <!-- Right Panel -->
  <g transform="translate(1260, 480)">
    <rect x="0" y="0" width="240" height="200" fill="#1a2836" stroke="#253448" rx="4" />
    <text x="20" y="30" font-family="monospace" font-size="12" fill="#7fa8f0" font-weight="bold">ORBITAL INCLINATION</text>
    <text x="20" y="70" font-family="monospace" font-size="32" font-weight="bold" fill="#e9eef6">51.6°</text>
    <text x="20" y="110" font-family="monospace" font-size="12" fill="#7fa8f0" font-weight="bold">APOGEE ALTITUDE</text>
    <text x="20" y="150" font-family="monospace" font-size="32" font-weight="bold" fill="#7fd4a8">420 KM</text>
  </g>

  <!-- Graticule Outer Degree Ticks Frame -->
  <g stroke="#7fa8f0" stroke-width="1.5">
    <!-- Top & bottom ticks -->
    <line x1="300" y1="40" x2="300" y2="55" />
<line x1="370" y1="40" x2="370" y2="55" />
<line x1="440" y1="40" x2="440" y2="55" />
<line x1="510" y1="40" x2="510" y2="55" />
<line x1="580" y1="40" x2="580" y2="55" />
<line x1="650" y1="40" x2="650" y2="55" />
<line x1="720" y1="40" x2="720" y2="55" />
<line x1="790" y1="40" x2="790" y2="55" />
<line x1="860" y1="40" x2="860" y2="55" />
<line x1="930" y1="40" x2="930" y2="55" />
<line x1="1000" y1="40" x2="1000" y2="55" />
<line x1="1070" y1="40" x2="1070" y2="55" />
<line x1="1140" y1="40" x2="1140" y2="55" />
<line x1="1210" y1="40" x2="1210" y2="55" />
<line x1="1280" y1="40" x2="1280" y2="55" />
    <line x1="300" y1="945" x2="300" y2="960" />
<line x1="370" y1="945" x2="370" y2="960" />
<line x1="440" y1="945" x2="440" y2="960" />
<line x1="510" y1="945" x2="510" y2="960" />
<line x1="580" y1="945" x2="580" y2="960" />
<line x1="650" y1="945" x2="650" y2="960" />
<line x1="720" y1="945" x2="720" y2="960" />
<line x1="790" y1="945" x2="790" y2="960" />
<line x1="860" y1="945" x2="860" y2="960" />
<line x1="930" y1="945" x2="930" y2="960" />
<line x1="1000" y1="945" x2="1000" y2="960" />
<line x1="1070" y1="945" x2="1070" y2="960" />
<line x1="1140" y1="945" x2="1140" y2="960" />
<line x1="1210" y1="945" x2="1210" y2="960" />
<line x1="1280" y1="945" x2="1280" y2="960" />
  </g>
</svg>
