<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="y2k-bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eaf4ff"/>
      <stop offset="50%" stop-color="#d9e9ff"/>
      <stop offset="100%" stop-color="#c5dcff"/>
    </linearGradient>
    <linearGradient id="y2k-chrome1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#b0c8e8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#6f4de8"/>
      <stop offset="100%" stop-color="#1b2340"/>
    </linearGradient>
    <linearGradient id="y2k-chrome2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#838bac"/>
      <stop offset="52%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#4b557a"/>
      <stop offset="100%" stop-color="#eaf4ff"/>
    </linearGradient>
    <linearGradient id="y2k-violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8e72f5"/>
      <stop offset="100%" stop-color="#6f4de8"/>
    </linearGradient>
    <radialGradient id="y2k-spec1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#6f4de8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1b2340" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="y2k-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6f4de8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6f4de8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#eaf4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#y2k-bg)"/>

  <!-- Cyber grid backdrop -->
  <g opacity="0.35" stroke="#6f4de8" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
    <line x1="1000" y1="0" x2="1000" y2="1000"/>
    <line x1="1200" y1="0" x2="1200" y2="1000"/>
    <line x1="1400" y1="0" x2="1400" y2="1000"/>
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
  </g>

  <!-- Central Violet Glow -->
  <circle cx="800" cy="500" r="480" fill="url(#y2k-glow)"/>

  <!-- Orbital Chrome Rings -->
  <g transform="translate(800 500) rotate(-24)">
    <ellipse cx="0" cy="0" rx="640" ry="220" fill="none" stroke="url(#y2k-chrome2)" stroke-width="16" opacity="0.75"/>
    <ellipse cx="0" cy="0" rx="640" ry="220" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="520" ry="160" fill="none" stroke="#6f4de8" stroke-width="4" stroke-dasharray="14 10" opacity="0.5"/>
  </g>
  <g transform="translate(800 500) rotate(35)">
    <ellipse cx="0" cy="0" rx="580" ry="180" fill="none" stroke="url(#y2k-chrome1)" stroke-width="12" opacity="0.65"/>
    <ellipse cx="0" cy="0" rx="580" ry="180" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Secondary chrome spheres floating -->
  <g>
    <circle cx="340" cy="300" r="95" fill="url(#y2k-spec1)"/>
    <ellipse cx="320" cy="275" rx="35" ry="18" fill="#ffffff" opacity="0.85" transform="rotate(-20 320 275)"/>
    
    <circle cx="1280" cy="680" r="120" fill="url(#y2k-spec1)"/>
    <ellipse cx="1255" cy="645" rx="45" ry="22" fill="#ffffff" opacity="0.85" transform="rotate(-25 1255 645)"/>
    
    <circle cx="1240" cy="260" r="60" fill="url(#y2k-spec1)"/>
    <ellipse cx="1225" cy="245" rx="20" ry="10" fill="#ffffff" opacity="0.85" transform="rotate(-20 1225 245)"/>

    <circle cx="380" cy="740" r="70" fill="url(#y2k-spec1)"/>
    <ellipse cx="365" cy="720" rx="24" ry="12" fill="#ffffff" opacity="0.85" transform="rotate(-20 365 720)"/>
  </g>

  <!-- Central Massive Y2K 4-Point Chrome Cross Star -->
  <g transform="translate(800 500)">
    <!-- Outer chrome bevel left facet -->
    <path d="M 0 -360 Q 0 -120 -120 0 Q 0 120 0 360 Q 0 120 120 0 Q 0 -120 0 -360 Z" fill="url(#y2k-chrome1)" filter="drop-shadow(0 14px 24px rgba(27,35,64,0.3))"/>
    
    <!-- Sharp horizontal spikes -->
    <path d="M -460 0 Q -150 0 0 -90 Q 0 90 -150 0 Z" fill="url(#y2k-chrome2)"/>
    <path d="M 460 0 Q 150 0 0 -90 Q 0 90 150 0 Z" fill="url(#y2k-chrome1)"/>

    <!-- Sharp vertical spikes -->
    <path d="M 0 -460 Q 0 -150 -90 0 Q 90 0 0 -150 Z" fill="url(#y2k-chrome1)"/>
    <path d="M 0 460 Q 0 150 -90 0 Q 90 0 0 150 Z" fill="url(#y2k-chrome2)"/>

    <!-- Faceted diamond center cut -->
    <polygon points="0,-460 30,-90 460,0 30,90 0,460 -30,90 -460,0 -30,-90" fill="url(#y2k-chrome2)" stroke="#ffffff" stroke-width="4"/>
    <polygon points="0,-360 25,-70 360,0 25,70 0,360 -25,70 -360,0 -25,-70" fill="url(#y2k-chrome1)"/>

    <!-- Specular light reflections on ridge lines -->
    <line x1="0" y1="-460" x2="0" y2="460" stroke="#ffffff" stroke-width="5" opacity="0.95"/>
    <line x1="-460" y1="0" x2="460" y2="0" stroke="#ffffff" stroke-width="5" opacity="0.95"/>
    <circle cx="0" cy="0" r="42" fill="#ffffff"/>
    <circle cx="0" cy="0" r="28" fill="#6f4de8"/>
    <circle cx="-6" cy="-6" r="10" fill="#ffffff"/>
  </g>

  <!-- Y2K Millennial Capsule Badges -->
  <g transform="translate(180 120)">
    <rect width="240" height="48" rx="24" fill="#ffffff" stroke="#6f4de8" stroke-width="2" opacity="0.9"/>
    <circle cx="28" cy="24" r="12" fill="#6f4de8"/>
    <rect x="52" y="18" width="120" height="12" rx="6" fill="#1b2340"/>
    <circle cx="210" cy="24" r="6" fill="#6f4de8"/>
  </g>
  <g transform="translate(1180 840)">
    <rect width="240" height="48" rx="24" fill="#ffffff" stroke="#6f4de8" stroke-width="2" opacity="0.9"/>
    <circle cx="28" cy="24" r="12" fill="#6f4de8"/>
    <rect x="52" y="18" width="140" height="12" rx="6" fill="#1b2340"/>
  </g>

  <!-- Corner spark stars -->
  <g transform="translate(240 480) scale(0.4)">
    <path d="M 0 -120 Q 0 0 -120 0 Q 0 0 0 120 Q 0 0 120 0 Q 0 0 0 -120 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(1380 440) scale(0.5)">
    <path d="M 0 -120 Q 0 0 -120 0 Q 0 0 0 120 Q 0 0 120 0 Q 0 0 0 -120 Z" fill="#ffffff"/>
  </g>
</svg>