<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1512" />
      <stop offset="100%" stop-color="#130f0d" />
    </linearGradient>
    <linearGradient id="bc-brass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a7862" />
      <stop offset="25%" stop-color="#f0e7da" />
      <stop offset="50%" stop-color="#bda892" />
      <stop offset="75%" stop-color="#f0e7da" />
      <stop offset="100%" stop-color="#8a7862" />
    </linearGradient>
    <linearGradient id="bc-copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9743c" />
      <stop offset="35%" stop-color="#f0e7da" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#c9743c" />
      <stop offset="100%" stop-color="#1a0d05" />
    </linearGradient>
    <pattern id="bc-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#f0e7da" stroke-width="0.8" stroke-opacity="0.22" />
    </pattern>
    <filter id="bc-shadow">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bc-bg)" />

  <!-- Machine bench background guide grid -->
  <g stroke="#8a7862" stroke-width="1" stroke-opacity="0.18">
    <line x1="100" y1="100" x2="1500" y2="100" />
    <line x1="100" y1="500" x2="1500" y2="500" />
    <line x1="100" y1="900" x2="1500" y2="900" />
    <line x1="100" y1="100" x2="100" y2="900" />
    <line x1="800" y1="100" x2="800" y2="900" />
    <line x1="1500" y1="100" x2="1500" y2="900" />
  </g>

  <!-- Large Heavy Machined Brass Plate (Left/Center) -->
  <g filter="url(#bc-shadow)">
    <rect x="140" y="120" width="760" height="760" rx="6" fill="url(#bc-brass)" stroke="#8a7862" stroke-width="2" />
    <!-- Guilloche Hatching Overlay -->
    <rect x="140" y="120" width="760" height="760" rx="6" fill="url(#bc-hatch)" />
    <!-- Machined Inner Bevel Step -->
    <rect x="164" y="144" width="712" height="712" fill="none" stroke="#221b16" stroke-width="2" stroke-opacity="0.6" />
  </g>

  <!-- Interlocking Copper Bar Ingot (Right) -->
  <g filter="url(#bc-shadow)">
    <rect x="860" y="180" width="600" height="640" rx="6" fill="url(#bc-copper)" stroke="#c9743c" stroke-width="2" />
    <!-- Horizontal Copper Strip Inlays -->
    <line x1="860" y1="300" x2="1460" y2="300" stroke="#f0e7da" stroke-width="2" stroke-opacity="0.4" />
    <line x1="860" y1="420" x2="1460" y2="420" stroke="#1a0d05" stroke-width="3" stroke-opacity="0.6" />
    <line x1="860" y1="540" x2="1460" y2="540" stroke="#f0e7da" stroke-width="2" stroke-opacity="0.4" />
    <line x1="860" y1="660" x2="1460" y2="660" stroke="#1a0d05" stroke-width="3" stroke-opacity="0.6" />
  </g>

  <!-- Engraved Brass Plaque Text -->
  <g transform="translate(200, 200)">
    <rect width="480" height="150" fill="#1a1512" stroke="#c9743c" stroke-width="1.5" />
    <text x="24" y="38" font-family="'Cinzel', serif" font-size="20" font-weight="700" fill="#f0e7da" letter-spacing="3">ALLOY SPECIFICATION 128</text>
    <text x="24" y="70" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#c9743c">CU-ZN 70/30 (CARTRIDGE BRASS) + ETP COPPER</text>
    <line x1="24" y1="84" x2="456" y2="84" stroke="#8a7862" stroke-width="1" />
    <text x="24" y="108" font-family="'JetBrains Mono', monospace" font-size="11" fill="#bda892">TENSILE STRENGTH: 340 MPa · HARDNESS: 85 HRB</text>
    <text x="24" y="130" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8a7862">MILL CERT: ASTM B36 / B152 · LOT 128-BC</text>
  </g>

  <!-- Engraved Calibration Pitch Scale (Center Vertical Stack) -->
  <g transform="translate(770, 180)" stroke="#1a1512" stroke-width="2">
    <line x1="0" y1="0" x2="0" y2="640" stroke="#1a1512" stroke-width="4" />
    <line x1="-30" y1="80" x2="30" y2="80" />
    <line x1="-15" y1="160" x2="15" y2="160" />
    <line x1="-30" y1="240" x2="30" y2="240" />
    <line x1="-15" y1="320" x2="15" y2="320" />
    <line x1="-30" y1="400" x2="30" y2="400" />
    <line x1="-15" y1="480" x2="15" y2="480" />
    <line x1="-30" y1="560" x2="30" y2="560" />
  </g>

  <!-- Precision Countersunk Fastener Screws / Rivets -->
  <g fill="#2c231c" stroke="#f0e7da" stroke-width="1.5">
    <circle cx="180" cy="160" r="14" />
    <line x1="170" y1="160" x2="190" y2="160" stroke="#f0e7da" stroke-width="2" />
    <circle cx="860" cy="160" r="14" />
    <line x1="850" y1="160" x2="870" y2="160" stroke="#f0e7da" stroke-width="2" />
    <circle cx="180" cy="840" r="14" />
    <line x1="170" y1="840" x2="190" y2="840" stroke="#f0e7da" stroke-width="2" />
    <circle cx="860" cy="840" r="14" />
    <line x1="850" y1="840" x2="870" y2="840" stroke="#f0e7da" stroke-width="2" />
  </g>
</svg>
