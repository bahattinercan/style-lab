name: pages

# Static site feed: `node kit/build-site.mjs` _site/ builds (gallery + landing + catalog +
# live + WebP variants + original PNGs), then pushes it to GitHub Pages.
# Source files are in the repo: WebP variants `kit/site/thumbs/` (node kit/build-thumbs.mjs),
# PNGs `styles/<slug>/shots/` (node kit/render/render-shots.mjs). Does not run CI browser.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: site derle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Are the WebP derivatives current
        run: node kit/build-thumbs.mjs --check

      - name: site integrity
        run: node kit/build-site.mjs --check

      - name: siteyi derle
        run: node kit/build-site.mjs --clean

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
