name: gates

# Catalog doors — single source `kit/gates.sh` (31 steps). The steps are not relisted here:
# old version was calling v5 scripts (motion, render-sections, export/react) and in v6
# it was broken. The same command runs locally as well.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: browser (for the CDP gates)
        run: google-chrome --version || chromium --version || true
      - name: gates
        run: bash kit/gates.sh
