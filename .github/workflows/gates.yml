name: gates

# Katalog kapıları — tek kaynak `kit/gates.sh` (31 adım). Burada adımlar yeniden listelenmez:
# eski sürüm v5 scriptlerini (motion, render-sections, export/react) çağırıyordu ve v6'da
# kırılmıştı. Yerelde de aynı komut koşar.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: kapılar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: tarayıcı (CDP kapıları için)
        run: google-chrome --version || chromium --version || true
      - name: kapılar
        run: bash kit/gates.sh
